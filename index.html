<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jri.AI for Consultants</title>
    <meta name="description" content="Run your whole practice in one place — the clients who share their books with you, and the ones who have never heard of us." />
    <meta name="theme-color" content="#faf7f2" />

    <!-- The lotus. Same file as the business app, so a consultant who has seen one recognises the
         other; it is the brand mark, not a per-app icon. -->
    <link rel="icon" type="image/png" href="/jri-logo.png" />
    <link rel="apple-touch-icon" href="/jri-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter for the interface, Cormorant Garamond for the wordmark and display moments. That
         pairing IS the brand: warm serif over graphite sans, the same two faces the business app
         loads. Without Cormorant the wordmark falls back to whatever serif the OS has, and the two
         products stop looking like one company. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />

    <meta property="og:title" content="Jri.AI for Consultants" />
    <meta property="og:description" content="Your clients' books, your own client book, and the compliance calendar for both." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
